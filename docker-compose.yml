services:
  db:
    image: postgres:15-alpine
    container_name: trocadinho_db
    environment:
      POSTGRES_DB: trocadinhodb
      POSTGRES_USER: trocadinhoapp
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trocadinhoapp -d trocadinhodb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data: